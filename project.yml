name: DoomScroll
options:
  bundleIdPrefix: com.doomscroll
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: "" # Fill in your Apple Developer Team ID

targets:
  DoomScroll:
    type: application
    platform: iOS
    sources:
      - DoomScroll
      # xcprivacy must be bundled as a resource; explicit entry overrides xcodegen's
      # default handling for file types it doesn't auto-classify as resources.
      - path: DoomScroll/PrivacyInfo.xcprivacy
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doomscroll.app
        INFOPLIST_FILE: DoomScroll/Info.plist
    entitlements:
      path: DoomScroll/DoomScroll.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.doomscroll
    dependencies:
      - target: ShieldConfigurationExtension
      - target: ShieldActionExtension
      - target: DeviceActivityMonitorExtension
      - target: DoomScrollWidget

  ShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doomscroll.app.ShieldConfiguration
        INFOPLIST_FILE: ShieldConfigurationExtension/Info.plist
    entitlements:
      path: ShieldConfigurationExtension/ShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.doomscroll

  ShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doomscroll.app.ShieldAction
        INFOPLIST_FILE: ShieldActionExtension/Info.plist
    entitlements:
      path: ShieldActionExtension/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.doomscroll

  DoomScrollWidget:
    type: app-extension
    platform: iOS
    sources:
      - DoomScrollWidget
      # Widget needs access to shared model types
      - path: DoomScroll/Design/DesignSystem.swift
      - path: DoomScroll/Views/SquareEyesView.swift
      - path: DoomScroll/Shared/SharedDefaults.swift
      - path: DoomScroll/Models/UserProfile.swift
      - path: DoomScroll/Models/OverrideTracker.swift
      # Mascot slot system — MascotMood type used in widget entry
      - path: DoomScroll/Mascot/MascotKit.swift
      - path: DoomScroll/Mascot/SquareEyes/SquareEyesMascot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doomscroll.app.Widget
        INFOPLIST_FILE: DoomScrollWidget/Info.plist
    entitlements:
      path: DoomScrollWidget/DoomScrollWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.doomscroll

  DoomScrollTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DoomScrollTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doomscroll.tests
        # Host the tests inside the app process so @testable import DoomScroll works
        # and all linked frameworks (DeviceActivity etc.) are available.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DoomScroll.app/DoomScroll
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: DoomScroll
        embed: false

  DeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - DeviceActivityMonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doomscroll.app.DeviceActivityMonitor
        INFOPLIST_FILE: DeviceActivityMonitorExtension/Info.plist
    entitlements:
      path: DeviceActivityMonitorExtension/DeviceActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.doomscroll
